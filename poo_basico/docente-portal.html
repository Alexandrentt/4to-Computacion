<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aula Planner · Docente</title><style>
body{margin:0;background:#f4f6fa;color:#192235;font:15px/1.5 system-ui,sans-serif}.top{background:#172239;color:white;padding:16px 5%;display:flex;justify-content:space-between}.top a{color:white}main{max-width:1050px;margin:auto;padding:24px 16px}.panel{background:white;border:1px solid #e2e7f0;border-radius:12px;padding:18px;margin:0 0 16px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:13px}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid #ccd5e5;border-radius:8px;box-sizing:border-box;font:inherit}.field textarea{min-height:110px}.btn{padding:9px 12px;border:1px solid #e2e7f0;border-radius:8px;background:white;font:inherit;cursor:pointer}.primary{background:#354f9a;color:white}.notice{padding:10px;border-radius:8px;background:#eaf0ff;margin:12px 0}.error{background:#fff0f0;color:#8c2936}.success{background:#e6f8ef;color:#176343}.hidden{display:none!important}.item{padding:12px;border:1px solid #e2e7f0;border-radius:8px;margin:8px 0}.muted,small{color:#667187}.code{font:700 18px monospace;letter-spacing:2px;background:#f0f3f9;padding:12px;overflow-wrap:anywhere}@media(max-width:700px){.layout{grid-template-columns:1fr}}
</style></head><body><header class="top"><strong>Aula Planner · Panel docente</strong><div><a href="./index.html">Planificador</a> <button id="logoutBtn" class="btn hidden">Salir</button></div></header><main><h1>Clases y seguimiento</h1><p class="muted">Crea clases, códigos de inscripción y lecciones; revisa el progreso individual.</p><div id="notice" class="notice hidden"></div>
<section id="authPanel" class="panel"><h2>Acceso docente</h2><form id="loginForm"><div class="field"><label>Correo</label><input id="email" type="email" required></div><div class="field"><label>Contraseña</label><input id="password" type="password" required></div><button class="btn primary">Iniciar sesión</button></form></section>
<section id="teacherArea" class="hidden"><section class="panel"><h2>Crear clase</h2><form id="classForm"><div class="layout"><div class="field"><label>Curso</label><select id="courseId" required></select></div><div class="field"><label>Nombre de la clase</label><input id="className" required maxlength="120" placeholder="Programación I · Sección A"></div></div><button class="btn primary">Crear clase</button></form></section>
<div class="layout"><section class="panel"><h2>Mis clases</h2><div id="classList"></div></section><section class="panel"><h2>Código de inscripción</h2><form id="codeForm"><div class="field"><label>Clase</label><select id="classSelect" required></select></div><div class="layout"><div class="field"><label>Límite de usos</label><input id="maxUses" type="number" min="1" max="500" value="35"></div><div class="field"><label>Vence en días (0 = nunca)</label><input id="expiryDays" type="number" min="0" max="365" value="30"></div></div><button class="btn primary">Generar código</button></form><div id="newCode" class="hidden"></div></section></div>
<section class="panel"><h2>Publicar lección</h2><form id="lessonForm"><div class="field"><label>Clase</label><select id="lessonClass" required></select></div><div class="field"><label>Título</label><input id="lessonTitle" required maxlength="180"></div><div class="field"><label>Resumen</label><input id="lessonSummary" maxlength="500"></div><div class="field"><label>Contenido</label><textarea id="lessonText" required></textarea></div><label><input id="publishNow" type="checkbox" checked> Publicar ahora</label><p><button class="btn primary">Guardar lección</button></p></form><div id="lessonList"></div></section>
<section class="panel"><h2>Seguimiento individual</h2><div id="progressList"></div></section></section></main><script type="module" src="/src/teacher-portal.js"></script></body></html>
