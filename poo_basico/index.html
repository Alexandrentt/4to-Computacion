<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172239">
  <title>Aula | Planificador docente</title>
  <style>
    :root {
      --bg: #f4f6fa;
      --paper: #fff;
      --ink: #192235;
      --muted: #667187;
      --line: #e2e7f0;
      --brand: #354f9a;
      --nav: #172239;
      --soft: #eaf0ff;
      --green: #187753;
      --amber: #97620a
    }
    * {
      box-sizing: border-box
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif
    }
    button, input, select, textarea {
      font: inherit
    }
    button {
      cursor: pointer
    }
    .shell {
      display: grid;
      grid-template-columns: 245px 1fr;
      min-height: 100vh
    }
    .side {
      background: var(--nav);
      color: white;
      padding: 25px 16px;
      display: flex;
      flex-direction: column;
      gap: 25px
    }
    .brand {
      display: flex;
      gap: 11px;
      align-items: center;
      padding: 0 8px
    }
    .logo {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      background: #e1e8ff;
      color: #2e4388;
      border-radius: 12px;
      font-weight: 900;
      font-size: 20px
    }
    .brand small {
      display: block;
      color: #acbad4
    }
    .nav {
      display: grid;
      gap: 6px
    }
    .nav button {
      border: 0;
      text-align: left;
      color: #cbd4e6;
      background: transparent;
      padding: 12px;
      border-radius: 9px
    }
    .nav button.active, .nav button:hover {
      background: #2c3d5c;
      color: white
    }
    .side-note {
      margin-top: auto;
      background: #202f4b;
      border: 1px solid #354665;
      border-radius: 12px;
      padding: 14px;
      color: #cbd4e6;
      font-size: 12px
    }
    .main {
      min-width: 0
    }
    .top {
      height: 72px;
      background: white;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      gap: 12px
    }
    .top small {
      display: block;
      color: var(--muted)
    }
    .top-actions {
      display: flex;
      gap: 8px
    }
    .content {
      max-width: 1350px;
      margin: auto;
      padding: 28px
    }
    .head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 23px
    }
    .eyebrow {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--brand);
      font-weight: 800
    }
    .head h1 {
      font-size: 29px;
      letter-spacing: -.04em;
      margin: 5px 0
    }
    .sub {
      color: var(--muted);
      max-width: 740px
    }
    .btn {
      background: white;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 9px 13px;
      font-weight: 650;
      color: var(--ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px
    }
    .btn.primary {
      background: var(--brand);
      color: white;
      border-color: var(--brand)
    }
    .btn.small {
      font-size: 12px;
      padding: 5px 8px
    }
    .btn.danger {
      color: #a43140
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 13px;
      margin-bottom: 19px
    }
    .stat {
      background: white;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px
    }
    .stat strong {
      display: block;
      font-size: 32px;
      font-weight: 800;
      color: var(--brand);
      margin: 4px 0
    }
    .stat small {
      color: var(--muted);
      font-size: 12px
    }
    .columns {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 19px
    }
    .panel {
      background: white;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 19px
    }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px
    }
    .panel h2 {
      margin: 0 0 8px 0;
      font-size: 18px
    }
    .notice {
      background: var(--soft);
      border: 1px solid #d6e4ff;
      border-radius: 9px;
      padding: 12px 16px;
      font-size: 13px;
      margin-bottom: 16px
    }
    .notice.warn {
      background: #fff8e6;
      border-color: #ffe6a0
    }
    .list {
      display: grid;
      gap: 8px
    }
    .listrow {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 12px;
      align-items: center
    }
    .listrow div:first-child {
      background: var(--brand);
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 14px
    }
    .grid-courses {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px
    }
    .course {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer
    }
    .course:hover {
      border-color: var(--brand)
    }
    .course h3 {
      margin: 6px 0 4px 0;
      font-size: 15px
    }
    .course p {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: var(--muted)
    }
    .tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 650;
      background: var(--line);
      color: var(--muted)
    }
    .tag.blue {
      background: #e1e8ff;
      color: #2e4388
    }
    .tag.green {
      background: #d4f4e4;
      color: #0f5c40
    }
    .tag.amber {
      background: #fff4d6;
      color: #7a5008
    }
    .tag.purple {
      background: #f0e6ff;
      color: #5c2e88
    }
    .tag.red {
      background: #ffe6e6;
      color: #882e2e
    }
    details.unit {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      margin-bottom: 8px
    }
    details.unit summary {
      padding: 12px 14px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px
    }
    .unitbody {
      padding: 0 14px 14px 14px
    }
    .topic {
      padding: 8px 10px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 7px;
      margin-bottom: 6px;
      font-size: 13px
    }
    .topic small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px
    }
    .filterbar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px
    }
    .filterbar select, .filterbar input {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      font-size: 14px
    }
    .filterbar select {
      flex: 0 0 240px
    }
    .filterbar input {
      flex: 1
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden
    }
    th {
      background: var(--bg);
      text-align: left;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em
    }
    td {
      padding: 12px 14px;
      border-top: 1px solid var(--line);
      font-size: 13px
    }
    td small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px
    }
    .cell-select {
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 12px
    }
    .empty {
      text-align: center;
      padding: 32px;
      color: var(--muted)
    }
    .field {
      margin-bottom: 14px
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 650;
      margin-bottom: 5px;
      color: var(--muted)
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      font-size: 14px;
      box-sizing: border-box
    }
    .field textarea {
      min-height: 80px;
      resize: vertical
    }
    .formgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }
    .span2 {
      grid-column: span 2
    }
    .modalback {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: none;
      place-items: center;
      z-index: 100
    }
    .modalback.show {
      display: grid
    }
    .modal {
      background: white;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, .2)
    }
    .modalhead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line)
    }
    .modalhead h2 {
      margin: 0;
      font-size: 18px
    }
    .modalhead button {
      border: 0;
      background: transparent;
      font-size: 24px;
      color: var(--muted);
      padding: 0 8px
    }
    .modal #fields {
      padding: 20px
    }
    .modalfoot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 16px 20px;
      border-top: 1px solid var(--line)
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--nav);
      color: white;
      padding: 12px 20px;
      border-radius: 9px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s
    }
    .toast.show {
      opacity: 1
    }
    .hidden {
      display: none !important
    }
    @media (max-width: 950px) {
      .shell {
        grid-template-columns: 205px 1fr
      }
      .stats {
        grid-template-columns: repeat(2, 1fr)
      }
      .columns {
        grid-template-columns: 1fr
      }
      .content {
        padding: 20px
      }
    }
    @media (max-width: 650px) {
      .shell {
        display: block
      }
      .side {
        padding: 12px;
        gap: 10px
      }
      .nav {
        grid-template-columns: repeat(3, 1fr)
      }
      .nav button {
        font-size: 12px;
        text-align: center;
        padding: 9px 5px
      }
      .side-note {
        display: none
      }
      .top {
        height: auto;
        min-height: 65px;
        padding: 12px
      }
      .top-actions .export {
        display: none
      }
      .content {
        padding: 15px 12px
      }
      .head {
        display: block
      }
      .head > .btn {
        margin-top: 12px
      }
      .grid-courses {
        grid-template-columns: 1fr
      }
      .formgrid {
        grid-template-columns: 1fr
      }
      .span2 {
        grid-column: auto
      }
      .stats {
        gap: 8px
      }
      .stat {
        padding: 12px
      }
      .stat strong {
        font-size: 25px
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <div class="logo">A</div>
        <div>
          <b>Aula</b>
          <small>Planificador docente</small>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button class="active" data-page="home">▦ Resumen</button>
        <button data-page="courses">▤ Cursos</button>
        <button data-page="sessions">▣ Sesiones</button>
        <a href="./contenido.html" style="display:block;text-decoration:none;color:#cbd4e6;background:#263755;padding:12px;border-radius:9px;font-size:14px">✎ Contenido por clase</a>
        <a href="./alumnos.html" style="display:block;text-decoration:none;color:#cbd4e6;background:#263755;padding:12px;border-radius:9px;font-size:14px">🎓 Portal de alumnos</a>
        <a href="./docente-portal.html" style="display:block;text-decoration:none;color:#cbd4e6;background:#263755;padding:12px;border-radius:9px;font-size:14px">▣ Aula virtual docente</a>
        <button data-page="resources">↗ Recursos</button>
        <button data-page="tasks">☑ Classroom</button>
        <button data-page="settings">⚙ Ajustes</button>
      </nav>
      <div class="side-note">
        <b style="color: white">Horario pendiente</b>
        <br>
        Las fechas y duraciones se pueden dejar vacías hasta confirmar el horario.
      </div>
    </aside>
    <main class="main">
      <header class="top">
        <div>
          <small>Espacio docente / <span id="crumb">Resumen</span></small>
          <b id="topTitle">Panel general</b>
        </div>
        <div class="top-actions">
          <button class="btn export" id="export">⇩ Respaldo</button>
          <button class="btn primary" id="quick">＋ Sesión</button>
        </div>
      </header>
      <div class="content" id="view"></div>
    </main>
  </div>

  <div class="modalback" id="back">
    <section class="modal" role="dialog" aria-modal="true">
      <div class="modalhead">
        <h2 id="mtitle">Nuevo registro</h2>
        <button class="btn" id="close">×</button>
      </div>
      <form id="form">
        <div id="fields"></div>
        <div class="modalfoot">
          <button type="button" class="btn danger hidden" id="delete">Eliminar</button>
          <div style="margin-left: auto; display: flex; gap: 8px">
            <button type="button" class="btn" id="cancel">Cancelar</button>
            <button class="btn primary" type="submit">Guardar</button>
          </div>
        </div>
      </form>
    </section>
  </div>

  <div class="modalback" id="authModal">
    <section class="modal" role="dialog" aria-modal="true">
      <div class="modalhead">
        <h2 id="authTitle">Iniciar sesión</h2>
        <button class="btn" id="authClose">×</button>
      </div>
      <form id="authForm">
        <div id="authFields">
          <div class="field">
            <label>Correo electrónico</label>
            <input type="email" id="authEmail" required placeholder="tu@email.com">
          </div>
          <div class="field">
            <label>Contraseña</label>
            <input type="password" id="authPassword" required placeholder="Mínimo 6 caracteres">
          </div>
          <div class="field" id="authNameField" style="display: none">
            <label>Nombre para mostrar</label>
            <input type="text" id="authName" placeholder="Tu nombre">
          </div>
        </div>
        <div class="modalfoot">
          <button type="button" class="btn" id="authCancel">Cancelar</button>
          <button class="btn primary" type="submit" id="authSubmit">Iniciar sesión</button>
        </div>
      </form>
      <div style="padding: 12px 20px; text-align: center; border-top: 1px solid var(--line)">
        <button type="button" class="btn small" id="authToggle" style="border: none; color: var(--brand)">¿No tienes cuenta? Regístrate</button>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>
  <input id="importFile" class="hidden" type="file" accept=".json,application/json">

  <script type="module" src="/src/main.js"></script>
</body>
</html>
