<style>
:root{--bg:#f4f6fa;--paper:#fff;--ink:#192235;--muted:#667187;--line:#e2e7f0;--brand:#354f9a;--nav:#172239;--soft:#eaf0ff;--green:#187753;--amber:#97620a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:var(--nav);color:white;padding:25px 16px;display:flex;flex-direction:column;gap:25px}.brand{display:flex;gap:11px;align-items:center;padding:0 8px}.logo{width:42px;height:42px;display:grid;place-items:center;background:#e1e8ff;color:#2e4388;border-radius:12px;font-weight:900;font-size:20px}.brand small{display:block;color:#acbad4}.nav{display:grid;gap:6px}.nav button{border:0;text-align:left;color:#cbd4e6;background:transparent;padding:12px;border-radius:9px}.nav button.active,.nav button:hover{background:#2c3d5c;color:white}.side-note{margin-top:auto;background:#202f4b;border:1px solid #354665;border-radius:12px;padding:14px;color:#cbd4e6;font-size:12px}.main{min-width:0}.top{height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:12px}.top small{display:block;color:var(--muted)}.top-actions{display:flex;gap:8px}.content{max-width:1350px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:23px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--brand);font-weight:800}.head h1{font-size:29px;letter-spacing:-.04em;margin:5px 0}.sub{color:var(--muted);max-width:740px}.btn{background:white;border:1px solid var(--line);border-radius:9px;padding:9px 13px;font-weight:650;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn.primary{background:var(--brand);color:white;border-color:var(--brand)}.btn.small{font-size:12px;padding:5px 8px}.btn.danger{color:#a43140}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:19px}.stat,.panel,.course{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 7px 22px #19223508}.stat small{color:var(--muted)}.stat strong{display:block;font-size:30px;letter-spacing:-.04em;margin-top:8px}.columns{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}.panel{margin-bottom:16px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.panel h2{font-size:16px;margin:0}.grid-courses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.course{cursor:pointer;box-shadow:none}.course:hover{border-color:#9cace3}.course h3{font-size:15px;margin:12px 0 5px}.course p{font-size:13px;color:var(--muted);margin:0 0 14px}.tag{font-size:11px;font-weight:750;border-radius:6px;padding:4px 7px;background:#edf0f6;color:#566178;display:inline-block}.tag.blue{background:#e9edff;color:#354f9a}.tag.green{background:#e5f5ec;color:#187753}.tag.amber{background:#fff2d8;color:#97620a}.notice{padding:12px 14px;background:#eef2ff;border:1px solid #dce4ff;color:#35477d;border-radius:10px;font-size:13px;margin-bottom:16px}.notice.warn{background:#fff8e9;border-color:#f3e3b8;color:#785718}.list{display:grid}.listrow{padding:13px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}.listrow:last-child{border:0}.listrow strong{display:block;font-size:13px}.listrow small{display:block;color:var(--muted);margin-top:3px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filters input,.filters select,.field input,.field select,.field textarea,.cell-select{border:1px solid #d7deea;border-radius:8px;padding:9px 10px;background:white;color:var(--ink);max-width:100%}.filters input{flex:1;min-width:180px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#f8f9fc}td strong{display:block}td small{display:block;color:var(--muted);margin-top:3px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:750;color:#566178}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:85px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.span2{grid-column:1/-1}.empty{padding:25px;text-align:center;color:var(--muted)}.unit{border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden}.unit summary{cursor:pointer;padding:13px;background:#fafbfc;font-weight:750}.unitbody{padding:6px 14px 14px}.topic{padding:9px 0;border-bottom:1px solid #edf0f5}.topic:last-child{border:0}.topic small{display:block;color:var(--muted)}.modalback{display:none;position:fixed;inset:0;background:#10182799;z-index:5;align-items:center;justify-content:center;padding:18px}.modalback.open{display:flex}.modal{background:white;border-radius:15px;padding:22px;width:min(720px,100%);max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0}.modalfoot{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.toast{position:fixed;right:20px;bottom:20px;background:#172239;color:white;border-radius:9px;padding:12px 16px;display:none}.toast.show{display:block}.hidden{display:none!important}
@media(max-width:950px){.shell{grid-template-columns:205px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.content{padding:20px}}
@media(max-width:650px){.shell{display:block}.side{padding:12px;gap:10px}.nav{grid-template-columns:repeat(3,1fr)}.nav button{font-size:12px;text-align:center;padding:9px 5px}.side-note{display:none}.top{height:auto;min-height:65px;padding:12px}.top-actions .export{display:none}.content{padding:15px 12px}.head{display:block}.head>.btn{margin-top:12px}.grid-courses{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:25px}}

<body>
<div class="shell"><aside class="side"><div class="brand"><div class="logo">A</div><div><b>Aula</b><small>Planificador docente</small></div></div>
<nav class="nav" id="nav"><button class="active" data-page="home">▦ Resumen</button><button data-page="courses">▤ Cursos</button><button data-page="sessions">▣ Sesiones</button><button data-page="resources">↗ Recursos</button><button data-page="tasks">☑ Classroom</button><button data-page="settings">⚙ Ajustes</button></nav>

<script>
const starter=[
{id:"prog",name:"Programación I / Laboratorio 1",grade:"4.º Bachillerato",color:"blue",desc:"De algoritmos y PSeInt a Python estructurado y modular.",units:[
["Unidad 1 · Pensamiento algorítmico",["Pensamiento computacional y resolución de problemas","Entradas, procesos y salidas","Algoritmos y pseudocódigo","Diagramas de flujo","Uso de PSeInt","Variables y operaciones en pseudocódigo","Práctica integradora de lógica"]],
["Unidad 2 · Fundamentos de Python",["Preparación del entorno Python","Primer programa, print y comentarios","Variables, tipos y conversiones","Operadores aritméticos, relacionales y lógicos","Entrada de datos","Condicionales simples y múltiples","Problemas de decisión en Python y PSeInt"]],
["Unidad 3 · Control y colecciones",["Ciclo while","Ciclo for y rangos","Contadores, acumuladores y validación","Cadenas de texto","Listas y recorridos","Listas anidadas y matrices","Reto con ciclos y colecciones"]],
["Unidad 4 · Programación modular",["Descomposición en funciones","Parámetros y retorno","Alcance de variables","Módulos e importaciones","Validación y errores","Archivos de texto según el ritmo","Proyecto estructurado y documentado"]]]},
{id:"sistemas",name:"Sistemas e Instalación de Software",grade:"4.º Bachillerato",color:"green",desc:"Instalación, configuración y recuperación segura de sistemas.",units:[
["Unidad 1 · Fundamentos y preparación",["Hardware, firmware y software","Sistemas operativos y licencias","BIOS/UEFI y arranque","Particiones y sistemas de archivos","Requisitos y compatibilidad","Medios de instalación","Lista de comprobación previa"]],
["Unidad 2 · Instalación de sistemas",["Respaldos y autorización","Instalación en máquina virtual o equipo de práctica","Particionado y riesgos","Configuración inicial","Instalación limpia frente a actualización","Verificación del arranque","Informe de instalación"]],
["Unidad 3 · Configuración",["Controladores","Actualizaciones","Instalación de aplicaciones","Usuarios, grupos y permisos","Licencias y software legítimo","Configuración básica de red","Herramientas de diagnóstico"]],
["Unidad 4 · Recuperación",["Copias de seguridad","Restauración de archivos","Recuperación del sistema","Máquinas virtuales y snapshots","Errores frecuentes de arranque","Bitácora de recuperación","Informe técnico final"]]]},
{id:"mantenimiento",name:"Mantenimiento y Reparación de Computadoras",grade:"5.º Bachillerato",color:"amber",desc:"Prevención, diagnóstico sistemático y reparación documentada.",units:[
["Unidad 1 · Seguridad y componentes",["Seguridad del taller y registro del equipo","Electricidad estática y ESD","Herramientas y organización","Placa base, CPU, RAM y discos","Fuente de poder y refrigeración","Inspección visual","Rutina preventiva"]],
["Unidad 2 · Diagnóstico",["Síntoma, hipótesis, prueba y resultado","Equipo no enciende","POST e indicadores de error","Memoria RAM y almacenamiento","Temperatura y ventilación","Software frente a hardware","Árbol de diagnóstico"]],
["Unidad 3 · Mantenimiento correctivo",["Limpieza interna segura","Montaje y desmontaje supervisado","Compatibilidad de componentes","Sustitución de piezas","Pruebas posteriores","Inventario y repuestos","Evaluación práctica"]],
["Unidad 4 · Casos integrales",["Árbol de decisión para averías","Caso de equipo que no arranca","Caso de lentitud o temperatura","Estimación de costos","Informe técnico","Recepción y entrega simulada","Caso final documentado"]]]},
{id:"lab2",name:"Laboratorio 2",grade:"5.º Bachillerato",color:"blue",desc:"Diseño de software con clases, objetos y relaciones.",units:[
["Unidad 1 · Clases y objetos",["Repaso de funciones y módulos","Clases y objetos","Atributos y métodos","Constructores","Estado y comportamiento","Modelado de entidades","Práctica de objetos"]],
["Unidad 2 · Diseño de objetos",["Encapsulación","Validación del estado","Composición","Relaciones entre clases","Responsabilidades y cohesión","Modelo de dominio","Implementación y pruebas"]],
["Unidad 3 · Reutilización",["Herencia y especialización","Sobrescritura de métodos","Polimorfismo","Composición frente a herencia","Organización por archivos","Pruebas y depuración","Ejercicio integrador"]],
["Unidad 4 · Proyecto integrador",["Problema y requisitos","Diseño de clases","Implementación incremental","Validación de entradas","Pruebas normales y límites","Documentación técnica","Demostración y retrospectiva"]]]}
];
const KEY="aula-docente-4to-v1";let db={courses:starter,sessions:[],resources:[],tasks:[],settings:{year:"",start:"",end:"",block:"",schedule:"Pendiente de confirmar"}};
let page="home",editing=null,kind=null,filterCourse="all";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.courses))db=x}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function msg(t){$("#toast").textContent=t;$("#toast").classList.add("show");setTimeout(()=>$("#toast").classList.remove("show"),2200)}
function cname(id){return db.courses.find(c=>c.id===id)?.name||"Curso no asignado"}
function datefmt(d){return d?new Date(d+"T12:00:00").toLocaleDateString("es-GT",{day:"numeric",month:"short",year:"numeric"}):"Sin fecha"}
function courseOptions(id){return db.courses.map(c=>'<option value="'+c.id+'" '+(c.id===id?'selected':'')+'>'+esc(c.name)+'</option>').join("")}
function setPage(p){page=p;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));let names={home:"Resumen",courses:"Plan de estudios",sessions:"Sesiones",resources:"Recursos",tasks:"Tareas y Classroom",settings:"Configuración"};$("#crumb").textContent=names[p];$("#topTitle").textContent=names[p];render()}
function head(eyebrow,title,sub,button=""){return '<div class="head"><div><div class="eyebrow">'+eyebrow+'</div><h1>'+title+'</h1><div class="sub">'+sub+'</div></div>'+button+'</div>'}
function render(){let v=$("#view");if(page==="home")v.innerHTML=home();if(page==="courses")v.innerHTML=coursesPage();if(page==="sessions")v.innerHTML=tablePage("sessions");if(page==="resources")v.innerHTML=tablePage("resources");if(page==="tasks")v.innerHTML=tablePage("tasks");if(page==="settings")v.innerHTML=settingsPage();bind()}
function home(){return head("Ciclo lectivo · "+esc(db.settings.year||"Por configurar"),"Tu planificación, en un solo lugar.","Organiza los cuatro cursos, prepara sesiones, guarda recursos y registra el seguimiento de Classroom.",'<button class="btn primary" data-new="sessions">＋ Planificar sesión</button>')+
'<div class="stats"><div class="stat"><small>Cursos activos</small><strong>'+db.courses.length+'</strong><small>4.º y 5.º Bachillerato</small></div><div class="stat"><small>Sesiones</small><strong>'+db.sessions.length+'</strong><small>'+db.sessions.filter(x=>x.date).length+' con fecha</small></div><div class="stat"><small>Recursos</small><strong>'+db.resources.length+'</strong><small>Enlaces externos</small></div><div class="stat"><small>Tareas</small><strong>'+db.tasks.length+'</strong><small>'+db.tasks.filter(x=>x.status==="Revisada").length+' revisadas</small></div></div>'+
'<div class="columns"><section class="panel"><div class="panel-head"><h2>Tus cursos</h2><button class="btn small" data-page="courses">Ver plan →</button></div><div class="grid-courses">'+db.courses.map(c=>'<div class="course" data-course="'+c.id+'"><span class="tag '+c.color+'">'+esc(c.grade)+'</span><h3>'+esc(c.name)+'</h3><p>'+esc(c.desc)+'</p><span class="tag">'+c.units.length+' unidades · '+db.sessions.filter(s=>s.courseId===c.id).length+' sesiones</span></div>').join("")+'</div></section><section><div class="panel"><div class="panel-head"><h2>Horario y ciclo</h2><span class="tag amber">'+esc(db.settings.schedule)+'</span></div><div class="notice warn">No se asignan fechas ni duración fija hasta confirmar el horario del establecimiento.</div><div class="list"><div class="listrow"><div>01</div><div><strong>Finales de enero</strong><small>Inicio previsto</small></div></div><div class="listrow"><div>04</div><div><strong>Cuatro unidades por curso</strong><small>Secuencia curricular inicial</small></div></div><div class="listrow"><div>10</div><div><strong>Mediados de octubre</strong><small>Cierre previsto, sujeto al calendario</small></div></div></div></div><div class="panel"><h2>Flujo de trabajo</h2><p class="sub">Planifica aquí → enlaza materiales → publica en Classroom → registra el estado manualmente.</p><p class="sub">Los archivos siguen en Drive o OneDrive; no se duplican.</p></div></section></div>'}
function coursesPage(){return head("Estructura curricular","Plan de estudios","Propuesta editable de cuatro unidades por curso; las fechas se asignarán después de confirmar el calendario.")+'<div class="notice">Plan inicial de referencia. Debe cotejarse con el programa oficial, el CNB y las indicaciones del centro educativo.</div>'+db.courses.map(c=>'<section class="panel"><div class="panel-head"><div><span class="tag '+c.color+'">'+esc(c.grade)+'</span><h2 style="margin-top:8px">'+esc(c.name)+'</h2><p class="sub">'+esc(c.desc)+'</p></div><button class="btn small" data-edit-course="'+c.id+'">Editar curso</button></div>'+c.units.map((u,i)=>'<details class="unit" '+(i===0?'open':'')+'><summary>'+esc(u[0])+' · '+u[1].length+' temas</summary><div class="unitbody">'+u[1].map((t,j)=>'<div class="topic">'+esc(t)+'<small>Unidad '+(i+1)+' · tema '+(j+1)+'</small></div>').join("")+'</div></details>').join("")+'</section>').join("")}
function tablePage(k){let conf={sessions:{title:"Sesiones",sub:"Fecha y duración opcionales; cada clase puede prepararse antes de confirmar el horario.",button:"＋ Nueva sesión"},resources:{title:"Recursos",sub:"Guarda enlaces de Drive, OneDrive, YouTube y documentos externos.",button:"＋ Añadir recurso"},tasks:{title:"Tareas y Classroom",sub:"Classroom gestiona entregas y notas oficiales; aquí llevas un seguimiento manual.",button:"＋ Registrar tarea"}}[k];let rows=db[k].filter(x=>filterCourse==="all"||x.courseId===filterCourse);let body=rows.length?rows.map(x=>{if(k==="sessions")return '<tr><td><strong>'+esc(x.title)+'</strong><small>'+esc(x.objective||"Sin objetivo")+'</small></td><td>'+esc(cname(x.courseId))+'</td><td>'+datefmt(x.date)+'<small>'+(x.duration?esc(x.duration)+" min":"Duración pendiente")+'</small></td><td><span class="tag">'+esc(x.status||"Borrador")+'</span></td><td><button class="btn small" data-edit="'+k+':'+x.id+'">Editar</button></td></tr>';if(k==="resources")return '<tr><td><strong>'+esc(x.title)+'</strong><small>'+esc(x.notes||"")+'</small></td><td>'+esc(cname(x.courseId))+'</td><td>'+esc(x.type||"Otro")+'</td><td>'+(x.url?'<a target="_blank" rel="noreferrer" href="'+esc(x.url)+'">Abrir ↗</a>':"—")+'</td><td><button class="btn small" data-edit="'+k+':'+x.id+'">Editar</button></td></tr>';return '<tr><td><strong>'+esc(x.title)+'</strong><small>'+esc(x.description||"")+'</small></td><td>'+esc(cname(x.courseId))+'</td><td>'+datefmt(x.dueDate)+'</td><td><select class="cell-select" data-status="'+x.id+'">'+["Pendiente","Publicada","En revisión","Revisada"].map(s=>'<option '+(s===(x.status||"Pendiente")?'selected':'')+'>'+s+'</option>').join("")+'</select></td><td>'+(x.url?'<a target="_blank" rel="noreferrer" href="'+esc(x.url)+'">Classroom ↗</a>':"Sin enlace")+'</td><td><button class="btn small" data-edit="'+k+':'+x.id+'">Editar</button></td></tr>'}).join(""):'<tr><td colspan="6"><div class="empty">Todavía no hay registros. Crea el primero con el botón superior.</div></td></tr>';let heads=k==="sessions"?"<th>Sesión</th><th>Curso</th><th>Fecha / duración</th><th>Estado</th><th></th>":k==="resources"?"<th>Recurso</th><th>Curso</th><th>Tipo</th><th>Enlace</th><th></th>":"<th>Tarea</th><th>Curso</th><th>Entrega</th><th>Seguimiento</th><th>Classroom</th><th></th>";return head("Organización docente",conf.title,conf.sub,'<button class="btn primary" data-new="'+k+'">'+conf.button+'</button>')+(k==="tasks"?'<div class="notice">No hay conexión automática con la API de Classroom. Pega aquí el enlace de la tarea después de publicarla.</div>':"")+'<div class="filters"><select id="courseFilter"><option value="all">Todos los cursos</option>'+courseOptions(filterCourse==="all"?"":filterCourse)+'</select><input id="search" placeholder="Buscar en esta lista…"></div><section class="panel"><div class="tablewrap"><table><thead><tr>'+heads+'</tr></thead><tbody id="rows">'+body+'</tbody></table></div></section>'}
function settingsPage(){return head("Preferencias","Configuración","Define el ciclo y la duración solo cuando tengas confirmación del centro.")+'<div class="columns"><section class="panel"><h2>Calendario lectivo</h2><div class="field"><label>Año o ciclo</label><input id="year" value="'+esc(db.settings.year)+'" placeholder="Ej. 2027"></div><div class="formgrid"><div class="field"><label>Inicio previsto</label><input id="start" type="date" value="'+esc(db.settings.start)+'"></div><div class="field"><label>Cierre previsto</label><input id="end" type="date" value="'+esc(db.settings.end)+'"></div></div><div class="field"><label>Duración del bloque (minutos, opcional)</label><input id="block" type="number" min="1" value="'+esc(db.settings.block)+'" placeholder="Dejar vacío hasta confirmar"></div><div class="field"><label>Estado del horario</label><select id="schedule"><option>Pendiente de confirmar</option><option '+(db.settings.schedule==="Confirmado"?'selected':'')+'>Confirmado</option></select></div><button class="btn primary" id="saveSettings">Guardar configuración</button></section><section class="panel"><h2>Respaldo de datos</h2><div class="notice warn">Los datos de esta versión se guardan en el navegador actual. No se sincronizan todavía entre dispositivos.</div><button class="btn" id="export2">⇩ Exportar JSON</button> <button class="btn" id="import2">⇧ Importar JSON</button><div style="height:16px"></div><h2>Integraciones</h2><p class="sub">Google Classroom: enlace y estado manual.</p><p class="sub">Drive / OneDrive: solo se guardan los enlaces.</p><p class="sub">Siguiente fase: autenticación y base de datos compartida.</p></section></div>'}
function bind(){document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>setPage(b.dataset.page));document.querySelectorAll("[data-new]").forEach(b=>b.onclick=()=>openForm(b.dataset.new));document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{let [k,id]=b.dataset.edit.split(":");openForm(k,id)});document.querySelectorAll("[data-edit-course]").forEach(b=>b.onclick=()=>openForm("course",b.dataset.editCourse));document.querySelectorAll("[data-course]").forEach(b=>b.onclick=()=>setPage("courses"));let cf=$("#courseFilter");if(cf){cf.value=filterCourse;cf.onchange=()=>{filterCourse=cf.value;render()};$("#search").oninput=()=>document.querySelectorAll("#rows tr").forEach(r=>r.style.display=r.textContent.toLowerCase().includes($("#search").value.toLowerCase())?"":"none")}document.querySelectorAll("[data-status]").forEach(s=>s.onchange=()=>{let t=db.tasks.find(t=>t.id===s.dataset.status);if(t){t.status=s.value;save();msg("Seguimiento actualizado")}});if($("#saveSettings"))$("#saveSettings").onclick=()=>{db.settings={year:$("#year").value,start:$("#start").value,end:$("#end").value,block:$("#block").value,schedule:$("#schedule").value};save();render();msg("Configuración guardada")};if($("#export2"))$("#export2").onclick=exportData;if($("#import2"))$("#import2").onclick=()=>$("#importFile").click()}
function openForm(k,id=null){kind=k;editing=id;let coll=k==="course"?"courses":k;let item=id?db[coll].find(x=>x.id===id):null;$("#mtitle").textContent=(id?"Editar ":"Nuevo ")+({sessions:"sesión",resources:"recurso",tasks:"tarea",course:"curso"}[k]);$("#delete").classList.toggle("hidden",!id||k==="course");let f="";const field=(label,name,value="",type="text",extra="")=>'<div class="field"><label>'+label+'</label><input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+extra+'></div>';const selectCourse='<div class="field"><label>Curso</label><select name="courseId">'+courseOptions(item?.courseId||db.courses[0].id)+'</select></div>';if(k==="sessions")f='<div class="formgrid"><div class="field span2"><label>Título *</label><input name="title" required value="'+esc(item?.title||"")+'"></div>'+selectCourse+'<div class="field"><label>Estado</label><select name="status">'+["Borrador","Lista","Impartida","Reprogramar"].map(s=>'<option '+(item?.status===s?'selected':'')+'>'+s+'</option>').join("")+'</select></div>'+field("Fecha opcional","date",item?.date||"","date")+field("Duración en minutos opcional","duration",item?.duration||"","number","min=1")+'<div class="field span2"><label>Objetivo de aprendizaje observable</label><textarea name="objective" placeholder="Al finalizar, el estudiante podrá…">'+esc(item?.objective||"")+'</textarea></div><div class="field span2"><label>Activación o repaso</label><textarea name="activation" placeholder="Pregunta inicial, recuperación de conocimientos previos…">'+esc(item?.activation||"")+'</textarea></div><div class="field span2"><label>Explicación o modelado docente</label><textarea name="explanation" placeholder="Conceptos clave y demostración paso a paso…">'+esc(item?.explanation||"")+'</textarea></div><div class="field span2"><label>Práctica guiada</label><textarea name="guidedPractice" placeholder="Ejercicio resuelto con acompañamiento…">'+esc(item?.guidedPractice||"")+'</textarea></div><div class="field span2"><label>Práctica autónoma</label><textarea name="independentPractice" placeholder="Actividad que cada estudiante resolverá…">'+esc(item?.independentPractice||"")+'</textarea></div><div class="field span2"><label>Cierre y errores frecuentes</label><textarea name="closing" placeholder="Síntesis, comprobación de comprensión y errores que atender…">'+esc(item?.closing||"")+'</textarea></div><div class="field span2"><label>Actividades / secuencia adicional</label><textarea name="activities">'+esc(item?.activities||"")+'</textarea></div>'+field("Materiales o enlaces","materialUrl",item?.materialUrl||"","url")+'<div class="field span2"><label>Evidencia de aprendizaje</label><textarea name="evidence" placeholder="Producto observable que demostrará el aprendizaje…">'+esc(item?.evidence||"")+'</textarea></div><div class="field span2"><label>Criterios de evaluación</label><textarea name="criteria" placeholder="Qué debe cumplir la evidencia para considerarse lograda…">'+esc(item?.criteria||"")+'</textarea></div><div class="field span2"><label>Tarea para Classroom (opcional)</label><textarea name="homework" placeholder="Consigna que se publicará manualmente en Classroom…">'+esc(item?.homework||"")+'</textarea></div>'+field("Fecha de entrega de la tarea","homeworkDueDate",item?.homeworkDueDate||"","date")+'<div class="field span2"><label>Notas docentes</label><textarea name="notes">'+esc(item?.notes||"")+'</textarea></div></div>';if(k==="resources")f='<div class="formgrid"><div class="field span2"><label>Nombre *</label><input name="title" required value="'+esc(item?.title||"")+'"></div>'+selectCourse+'<div class="field"><label>Tipo</label><select name="type">'+["Google Drive","OneDrive","YouTube","Documento","Presentación","Sitio web","Otro"].map(s=>'<option '+(item?.type===s?'selected':'')+'>'+s+'</option>').join("")+'</select></div><div class="field span2"><label>URL *</label><input name="url" required type="url" value="'+esc(item?.url||"")+'" placeholder="https://…"></div><div class="field span2"><label>Notas</label><textarea name="notes">'+esc(item?.notes||"")+'</textarea></div></div>';if(k==="tasks")f='<div class="formgrid"><div class="field span2"><label>Nombre de la tarea *</label><input name="title" required value="'+esc(item?.title||"")+'"></div>'+selectCourse+field("Fecha de entrega","dueDate",item?.dueDate||"","date")+'<div class="field span2"><label>Enlace de Classroom</label><input name="url" type="url" value="'+esc(item?.url||"")+'" placeholder="Pega el enlace publicado"></div><div class="field"><label>Seguimiento</label><select name="status">'+["Pendiente","Publicada","En revisión","Revisada"].map(s=>'<option '+(item?.status===s?'selected':'')+'>'+s+'</option>').join("")+'</select></div>'+field("Puntos (opcional)","points",item?.points||"","number","min=0")+'<div class="field span2"><label>Instrucciones</label><textarea name="description">'+esc(item?.description||"")+'</textarea></div></div>';if(k==="course")f=field("Nombre","name",item?.name||"","text","required")+field("Grado","grade",item?.grade||"")+field("Área / descripción corta","desc",item?.desc||"");$("#fields").innerHTML=f;$("#back").classList.add("open")}
function closeForm(){$("#back").classList.remove("open")}
$("#form").onsubmit=e=>{e.preventDefault();let o={};new FormData(e.target).forEach((v,k)=>o[k]=String(v).trim());if(kind==="course"){Object.assign(db.courses.find(x=>x.id===editing),o)}else{let coll=kind,arr=db[coll];if(editing)Object.assign(arr.find(x=>x.id===editing),o);else arr.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),...o,...(kind==="sessions"?{status:o.status||"Borrador"}:{}),...(kind==="tasks"?{status:o.status||"Pendiente"}:{})})}save();closeForm();render();msg("Cambios guardados")};
function deleteRecord(){if(!editing||!confirm("¿Eliminar este registro?"))return;db[kind==="course"?"courses":kind]=db[kind==="course"?"courses":kind].filter(x=>x.id!==editing);save();closeForm();render();msg("Registro eliminado")}
function exportData(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="respaldo-aula-docente.json";a.click();URL.revokeObjectURL(a.href);msg("Respaldo preparado")}
$("#export").onclick=exportData;$("#quick").onclick=()=>openForm("sessions");$("#close").onclick=closeForm;$("#cancel").onclick=closeForm;$("#delete").onclick=deleteRecord;$("#back").onclick=e=>{if(e.target.id==="back")closeForm()};$("#importFile").onchange=e=>{let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.courses||!x.sessions||!x.resources||!x.tasks)throw Error();db=x;save();render();msg("Respaldo importado")}catch(err){alert("El JSON no tiene el formato esperado.")}};r.readAsText(file);e.target.value=""};
